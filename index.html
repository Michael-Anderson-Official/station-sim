<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>駅シム — 1面1線から新宿へ</title>
<meta name="theme-color" content="#0f1622">
<meta name="description" content="しょぼい無人駅を新宿級の巨大ターミナルまで育てる3D駅経営シミュレーション">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="駅シム">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app"></div>

<header id="topbar">
	<div class="row1">
		<div class="rank" id="rankBox">無人駅</div>
		<div class="clock" id="clockBox">1日目 05:00</div>
		<div class="money" id="moneyBox">¥200万</div>
	</div>
	<div class="row2">
		<div class="stat"><b id="paxBox">0</b><span>本日乗降</span></div>
		<div class="stat"><b id="waitBox">0</b><span>待機客</span></div>
		<div class="stat"><b id="satBox">70</b><span>評判</span></div>
		<div class="stat"><b id="townBox">1.0</b><span>街の発展</span></div>
	</div>
	<div id="rankBar"><i id="rankFill"></i><span id="rankNext">次: 小さな駅まで 2,000人/日</span></div>
</header>

<div id="speed">
	<button data-speed="0">⏸</button>
	<button data-speed="60" class="active">▶</button>
	<button data-speed="240">▶▶</button>
	<button data-speed="900">▶▶▶</button>
</div>

<div id="alert"></div>

<button id="buildBtn">🏗 増築</button>
<button id="diaBtn">🕒 ダイヤ</button>
<button id="logBtn">📋 日報</button>

<section id="sheet" hidden>
	<div class="sheetHead">
		<h2>増築メニュー</h2>
		<button id="sheetClose">✕</button>
	</div>
	<div id="upgrades"></div>
	<p class="hint">ボトルネックは「階段」「改札」「線路」。どこが詰まっているかは駅を見れば分かります。</p>
	<button id="resetBtn">はじめから（セーブ削除）</button>
</section>

<section id="diaSheet" hidden>
	<div class="sheetHead">
		<h2>ダイヤ</h2>
		<div id="diaStat"></div>
		<button id="diaClose">✕</button>
	</div>
	<div class="seg">
		<button data-tab="dia" class="on">ダイヤ</button>
		<button data-tab="fleet">契約</button>
	</div>

	<div id="diaPane">
		<div id="diaZoom">
			<button data-span="30">30分</button>
			<button data-span="60" class="on">1時間</button>
			<button data-span="180">3時間</button>
			<button data-span="1440">全日</button>
			<span id="diaClock"></span>
		</div>
		<canvas id="diaCv"></canvas>
		<p class="hint" id="diaHint">帯を横にドラッグすると、そのパターン全体がずれます。何も無い所をドラッグすると時刻が動きます。</p>
		<div id="diaList"></div>
		<button id="diaAdd">＋ パターンを追加</button>
		<div id="diaIssues"></div>
	</div>

	<div id="fleetPane" hidden>
		<div id="fleetHave"></div>
		<h3 class="sub">契約できる形式</h3>
		<div id="fleetShop"></div>
	</div>
</section>

<section id="logSheet" hidden>
	<div class="sheetHead">
		<h2>営業日報</h2>
		<button id="logClose">✕</button>
	</div>
	<div id="logList"><p class="hint">1日の営業が終わると（毎朝4時）ここに日報が届きます。</p></div>
</section>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="game.js"></script>
</body>
</html>
